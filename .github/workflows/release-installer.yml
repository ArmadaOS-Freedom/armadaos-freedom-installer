name: Release installer packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      system_image_digest:
        required: true
        type: string

permissions:
  contents: read

jobs:
  offline-inputs:
    name: Prepare the shared offline updater
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SYSTEM_IMAGE_DIGEST: ${{ inputs.system_image_digest }}
    steps:
      - name: Check out installer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=maintenance python3 -B -c 'import os; from build_installer_release import release_version; release_version(os.environ["RELEASE_VERSION"])'
          if [[ ! $SYSTEM_IMAGE_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "system_image_digest must be a full sha256 OCI digest" >&2
            exit 1
          fi

      - name: Free image workspace
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e
        with:
          remove-codeql: true

      - name: Enable containerd image storage
        shell: bash
        run: |
          set -euo pipefail
          # System images can exceed the legacy overlay2 layer limit.
          config=/etc/docker/daemon.json
          staged=$(mktemp)
          trap 'rm -f -- "$staged"' EXIT
          if sudo test -f "$config"; then
            sudo jq '.features["containerd-snapshotter"] = true' "$config" > "$staged"
          else
            printf '%s\n' '{"features":{"containerd-snapshotter":true}}' > "$staged"
          fi
          sudo install -D -m 0644 "$staged" "$config"
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | \
            jq -e 'any(.[]; .[0] == "driver-type" and .[1] == "io.containerd.snapshotter.v1")'

      - name: Pull the exact system image
        shell: bash
        id: system
        run: |
          set -euo pipefail
          image="ghcr.io/armadaos-freedom/armadaos-freedom@$SYSTEM_IMAGE_DIGEST"
          docker pull --platform linux/arm64 "$image"
          revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
          if [[ ! $revision =~ ^[0-9a-f]{40}$ ]]; then
            echo "System image lacks a full source revision label" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Check out the image's system source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ArmadaOS-Freedom/armadaos-freedom
          ref: ${{ steps.system.outputs.revision }}
          path: system-source
          persist-credentials: false

      - name: Generate the matching bootstrap and updater bundle
        shell: bash
        env:
          SYSTEM_IMAGE: ${{ steps.system.outputs.image }}
          SYSTEM_REVISION: ${{ steps.system.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git -C system-source rev-parse HEAD)" = "$SYSTEM_REVISION"
          bash maintenance/stage_installer_release_inputs.sh "$SYSTEM_IMAGE" \
            system-source "$SYSTEM_REVISION" "$RUNNER_TEMP/offline-inputs"

      - name: Upload the shared offline inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-shared-offline-inputs
          path: ${{ runner.temp }}/offline-inputs/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Package ${{ matrix.platform }}
    needs: offline-inputs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out installer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download the shared offline inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: installer-shared-offline-inputs
          path: ${{ runner.temp }}/offline-inputs

      - name: Verify the offline inputs
        shell: bash
        working-directory: ${{ runner.temp }}/offline-inputs
        run: shasum -a 256 -c SHA256SUMS

      - name: Prepare the Windows build container
        if: matrix.platform == 'win-x64'
        run: docker build -f tools/installer-builder.Dockerfile -t installer-release-builder tools

      - name: Set up the Mac .NET SDK
        if: matrix.platform == 'macos-arm64'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'

      - name: Publish Windows x64 installer
        if: matrix.platform == 'win-x64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-work" "$RUNNER_TEMP/release-dist"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$RUNNER_TEMP/release-work:/work" \
            -v "$RUNNER_TEMP/release-dist:/dist" \
            -v "$RUNNER_TEMP/offline-inputs:/offline:ro" \
            installer-release-builder python3 -B maintenance/build_installer_release.py \
              --platform win-x64 --version "$RELEASE_VERSION" --source-revision "$GITHUB_SHA" \
              --offline-dir /offline --work-dir /work --output-dir /dist

      - name: Publish Mac Apple silicon installer
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B maintenance/build_installer_release.py \
            --platform macos-arm64 --version "$RELEASE_VERSION" --source-revision "$GITHUB_SHA" \
            --offline-dir "$RUNNER_TEMP/offline-inputs" \
            --work-dir "$RUNNER_TEMP/release-work" --output-dir "$RUNNER_TEMP/release-dist"

      - name: Include the shared input provenance
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/offline-inputs/system-input.json" "$RUNNER_TEMP/release-dist/"
          cp "$RUNNER_TEMP/offline-inputs/SHA256SUMS" "$RUNNER_TEMP/release-dist/offline-inputs.sha256"

      - name: Upload the complete installer package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ArmadaOS-Freedom-Installer-${{ inputs.version }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-dist/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
